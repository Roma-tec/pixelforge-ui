<style>

  button, select { font-family: inherit; }

  /* ---------- верхняя панель ---------- */
  #bar { position:fixed; left:0; right:0; top:0; height:56px; z-index:20;
    display:flex; align-items:center; gap:12px; padding:0 14px;
    background:#121218; border-bottom:1px solid #2F2F3B; }
  #bar .logo { width:26px; height:26px; border-radius:50%;

  #bar .sub { font-size:11px; color:#6E6E80; }
  #bar .grow { flex:1 1 auto; }
  .sep { width:1px; height:26px; background:#2F2F3B; }

  .btn { height:32px; padding:0 12px; border-radius:8px; border:1px solid #2F2F3B;
    background:#24242E; color:#F2F2F7; font-size:12.5px; font-weight:500;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:#2E2E3A; }
  .btn.on { background:#6C4CF1; border-color:#6C4CF1; color:#fff; }
  .btn.primary { background:linear-gradient(135deg,#6C4CF1,#B14CF1,#F14CA6);
    border:none; color:#fff; font-weight:600; }
  .btn:disabled { opacity:.4; cursor:default; }
  .sc { height:30px; padding:0 10px; border-radius:15px; border:1px solid #2F2F3B;
    background:transparent; color:#A8A8B8; font-size:12px; cursor:pointer; }
  .sc:hover { color:#F2F2F7; border-color:#6C4CF1; }
  .sc.on { background:#2A2440; border-color:#8A73F5; color:#8A73F5; font-weight:600; }

  select { height:32px; padding:0 8px; border-radius:8px; border:1px solid #2F2F3B;
    background:#24242E; color:#F2F2F7; font-size:12.5px; max-width:280px; }

  /* ---------- сцена ---------- */
  #viewport { position:fixed; left:0; right:0; top:56px; bottom:46px;
    overflow:hidden; background:#08080B; }
  #stage { position:absolute; transform-origin:center center; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.active { display:block; animation:appear .26s cubic-bezier(.16,1,.3,1); }
  @keyframes appear { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
  .screen svg { width:100%; height:100%; display:block; }

  /* ---------- кликабельные зоны ---------- */
  .hot rect { fill: rgba(108,76,241,0); stroke: rgba(108,76,241,0); stroke-width:3;
    cursor:pointer; pointer-events:all; transition: fill .15s, stroke .15s; }
  .hot rect:hover { fill: rgba(108,76,241,.30); stroke:#8A73F5; }
  .hot rect.info { cursor:default; }
  .hot rect.info:hover { fill: rgba(43,217,195,.22); stroke:#2BD9C3; }
  body.show-hot .hot rect { fill: rgba(108,76,241,.18); stroke:#6C4CF1;
    stroke-dasharray:10 7; animation:pulse 2s ease-in-out infinite; }
  body.show-hot .hot rect.info { fill: rgba(43,217,195,.14); stroke:#2BD9C3;
    stroke-dasharray:10 7; }
  @keyframes pulse { 0%,100% { stroke-width:3 } 50% { stroke-width:5 } }

  /* ---------- нижняя подсказка ---------- */
  #hint { position:fixed; left:0; right:0; bottom:0; height:46px; z-index:20;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    background:#121218; border-top:1px solid #2F2F3B; font-size:12.5px; }
  #hint .step { color:#8A73F5; font-weight:600; white-space:nowrap; }
  #hint .txt { color:#A8A8B8; }
  #hint .keys { margin-left:auto; color:#6E6E80; font-size:11.5px; white-space:nowrap; }
  #hint kbd { background:#24242E; border:1px solid #2F2F3B; border-bottom-width:2px;
    border-radius:4px; padding:1px 5px; font-family:'JetBrains Mono',Consolas,monospace;
    font-size:10.5px; color:#F2F2F7; }
  #toast { position:fixed; left:50%; bottom:64px; transform:translateX(-50%) translateY(14px);
    background:#1B1B23; border:1px solid #2F2F3B; border-left:3px solid #2FBF71;
    border-radius:10px; padding:12px 18px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .22s, transform .22s; z-index:30; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast b { color:#2FBF71; }

const SCEN = [{"name": "Создание проекта", "steps": [{"base": "S1_Auth", "hint": "Шаг 1. Войдите в систему: введите e-mail и пароль, нажмите «Войти»."}, {"base": "S0_Dashboard", "hint": "Шаг 2. Нажмите «Создать проект» в правом верхнем углу — откроется холст."}, {"base": "S2_Canvas", "hint": "Шаг 3. Холст создан. Слева — инструменты, справа — панели «Слои», «Фильтры», «История», «Кисти»."}, {"base": "S5_Filters", "hint": "Шаг 4. Откройте вкладку «Фильтры», выберите эффект и нажмите «Применить»."}, {"base": "S6_Export", "hint": "Шаг 5. Нажмите «Экспортировать» — файл готов."}]}, {"name": "Применение фильтра", "steps": [{"base": "S2_Canvas", "hint": "Шаг 1. Откройте проект. Обратите внимание на строку параметров инструмента сверху."}, {"base": "S5_Filters", "hint": "Шаг 2. Панель фильтров открыта. Выберите категорию и фильтр — результат виден сразу."}, {"base": "S2_Canvas", "hint": "Шаг 3. Фильтр применён, шаг добавлен в историю (вкладка «История» справа)."}]}, {"name": "Работа со слоями", "steps": [{"base": "S2_Canvas", "hint": "Шаг 1. Проект открыт. Справа видна панель слоёв."}, {"base": "S4_Layers", "hint": "Шаг 2. Слои: порядок, группы, маски, режимы наложения, эффекты."}, {"base": "S2_Canvas", "hint": "Шаг 3. Вернулись на холст — композиция обновилась."}]}, {"name": "Экспорт изображения", "steps": [{"base": "S2_Canvas", "hint": "Шаг 1. Изображение готово. Нажмите «Экспортировать» в правом верхнем углу."}, {"base": "S6_Export", "hint": "Шаг 2. Выберите пресет платформы (Instagram, VK, печать), формат и качество."}, {"base": "S0_Dashboard", "hint": "Шаг 3. Файл экспортирован — он появился в разделе «Экспорты»."}]}, {"name": "Мобильный сценарий", "steps": [{"base": "S9_Portrait", "hint": "Шаг 1. На телефоне — список проектов, поиск и нижняя навигация."}, {"base": "S9_Landscape", "hint": "Шаг 2. Поверните телефон: холст, док инструментов и экспорт."}, {"base": "S6_Export", "hint": "Шаг 3. Экспорт доступен и с телефона."}]}];

const stage   = document.getElementById('stage');
const viewport= document.getElementById('viewport');
const picker  = document.getElementById('picker');
const counter = document.getElementById('counter');
const hStep   = document.getElementById('hStep');
const hTxt    = document.getElementById('hTxt');
const toastEl = document.getElementById('toast');

const screens = [...document.querySelectorAll('.screen')];
const byId = {}; screens.forEach(s => byId[s.id] = s);

/* -------- какой экран в какой теме существует -------- */
const themeOf = {};   // base -> {dark:id, light:id}
screens.forEach(s => {
  const b = s.dataset.base;
  themeOf[b] = themeOf[b] || {};
  themeOf[b][s.dataset.theme] = s.id;
});
const ORDER = [...new Set(screens.map(s => s.dataset.base))];

let cur = 'Cover';
let theme = 'dark';
let hist = [];
let scen = -1, scenStep = 0;

function resolve(base) {
  const v = themeOf[base];
  if (!v) return null;
  return v[theme] || v.dark || v.light;
}

/* -------- масштаб -------- */
function fit() {
  const s = byId[cur];
  if (!s) return;
  const w = +s.dataset.w, h = +s.dataset.h;
  const k = Math.min((viewport.clientWidth - 32) / w, (viewport.clientHeight - 32) / h);
  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';
  stage.style.marginLeft = (-w / 2) + 'px';
  stage.style.marginTop  = (-h / 2) + 'px';
  stage.style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit);

/* -------- показ экрана -------- */
function show(base, push) {
  const id = resolve(base);
  if (!id) return;
  if (push !== false && cur && cur !== id) hist.push(cur);
  cur = id;
  screens.forEach(s => s.classList.toggle('active', s.id === id));
  picker.value = byId[id].dataset.base;
  const i = ORDER.indexOf(byId[id].dataset.base);
  counter.textContent = (i + 1) + ' / ' + ORDER.length;
  fit();
  location.hash = byId[id].dataset.base;
}

/* -------- смена темы -------- */
function setTheme(t) {
  theme = t;
  document.getElementById('theme').textContent = (t === 'dark' ? '☀ Тема' : '☾ Тема');
  const base = byId[cur].dataset.base;
  show(base, false);
  toast(t === 'dark' ? 'Включена тёмная тема' : 'Включена светлая тема');
}

/* -------- подсказка/toast -------- */
let tmr;
function toast(msg) {
  toastEl.innerHTML = '<b>✓</b> ' + msg;
  toastEl.classList.add('on');
  clearTimeout(tmr);
  tmr = setTimeout(() => toastEl.classList.remove('on'), 2200);
}

function hintShow(tip) {
  hTxt.textContent = tip;
}

/* -------- клики по зонам -------- */
stage.addEventListener('click', e => {
  const r = e.target.closest('rect[data-to], rect[data-act]');
  if (!r) return;
  const act = r.dataset.act;
  if (act === 'theme') { setTheme(theme === 'dark' ? 'light' : 'dark'); return; }
  if (act === 'theme_light') { setTheme('light'); return; }
  if (act === 'theme_dark')  { setTheme('dark');  return; }
  if (r.dataset.to) {
    toast(r.querySelector('title') ? r.querySelector('title').textContent : 'Переход');
    show(r.dataset.to);
  }
});
stage.addEventListener('mouseover', e => {
  const r = e.target.closest('rect[data-to], rect[data-act]');
  if (r) {
    const t = r.querySelector('title');
    if (t) hintShow((r.dataset.to ? '→ ' : '') + t.textContent);
  }
});
stage.addEventListener('mouseout', e => { if (!scen || scen < 0) hintShow(DEFAULT_HINT); });

const DEFAULT_HINT = 'Наведите курсор на элементы — кликабельные зоны подсветятся. Кнопка «Зоны» показывает все сразу.';

/* -------- сценарии -------- */
function startScen(i) {
  scen = i; scenStep = 0;
  document.querySelectorAll('.sc').forEach((b, k) => b.classList.toggle('on', k === i));
  stepScen(0);
}
function stepScen(k) {
  if (scen < 0) return;
  const sc = SCEN[scen];
  if (k >= sc.steps.length) { stopScen(); toast('Сценарий завершён'); return; }
  scenStep = k;
  const st = sc.steps[k];
  hStep.textContent = sc.name + ' · шаг ' + (k + 1) + ' из ' + sc.steps.length;
  hTxt.textContent = st.hint;
  show(st.base);
}
function stopScen() {
  scen = -1;
  document.querySelectorAll('.sc').forEach(b => b.classList.remove('on'));
  hStep.textContent = 'Свободный просмотр';
  hTxt.textContent = DEFAULT_HINT;
}
document.querySelectorAll('.sc').forEach(b =>
  b.onclick = () => (scen === +b.dataset.sc ? stopScen() : startScen(+b.dataset.sc)));

/* -------- кнопки -------- */
document.getElementById('hot').onclick = e => {
  document.body.classList.toggle('show-hot');
  e.currentTarget.classList.toggle('on');
};
document.getElementById('theme').onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');
document.getElementById('reset').onclick = () => { hist = []; stopScen(); setTheme('dark'); show('Cover', false); };
document.getElementById('prev').onclick = () => {
  if (scen >= 0 && scenStep > 0) { stepScen(scenStep - 1); return; }
  if (hist.length) { const p = hist.pop(); const b = byId[p].dataset.base; show(b, false); }
};
document.getElementById('next').onclick = () => {
  if (scen >= 0) { stepScen(scenStep + 1); return; }
  const i = ORDER.indexOf(byId[cur].dataset.base);
  show(ORDER[(i + 1) % ORDER.length]);
};
picker.onchange = () => show(picker.value);

/* -------- клавиатура -------- */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { document.getElementById('next').click(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { document.getElementById('prev').click(); e.preventDefault(); }
  else if (e.key === 'Escape') { stopScen(); if (hist.length) { const p = hist.pop(); show(byId[p].dataset.base, false); } }
  else if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') { document.getElementById('hot').click(); }
  else if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') { document.getElementById('theme').click(); }
});

/* -------- старт -------- */
const fromHash = location.hash.replace('#', '');
show(themeOf[fromHash] ? fromHash : 'Cover', false);
</script>
</body>
</html>
