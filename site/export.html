<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экспорт — PixelForge</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r-lg);
    border:1px solid var(--brd);background:var(--bg2);margin-bottom:10px}
  .item .thumb{width:74px;height:52px;border-radius:8px;flex:0 0 auto}
  .item .m{flex:1;min-width:0}
  .item .m b{display:block;font-size:14px}
  .item .m small{color:var(--t3);font-size:11.5px}
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .pr{border:1px solid var(--brd);background:var(--bg2);border-radius:var(--r-lg);padding:14px;cursor:pointer;transition:all var(--dur)}
  .pr.on{border-color:var(--accent);background:var(--accent-soft)}
  .pr b{display:block;font-size:13.5px}.pr small{color:var(--t3);font-size:11.5px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="top"></header>
  <div class="body">
    <nav class="side" id="side"></nav>
    <main class="main">
      <div class="pagehead"><h2>Экспорт</h2>
        <span class="spacer"></span>
        <select class="input" id="fmt" style="width:220px">
          <option value="image/png">PNG — без потерь</option>
          <option value="image/jpeg">JPG — компактный</option>
          <option value="image/webp">WEBP — для веба</option>
        </select>
      </div>

      <span class="up" style="display:block;margin-bottom:10px">Пресеты платформ</span>
      <div class="presets" id="presets"></div>

      <span class="up" style="display:block;margin:24px 0 10px">Проекты</span>
      <div id="list"></div>
    </main>
  </div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  if (!PF.User.require('export.html')) return;
  PF.header($('top'), { left: '<a class="btn ghost" href="index.html">Карта сайта</a>' });
  var n = PF.Projects.all().length;
  $('side').innerHTML =
    '<a href="dashboard.html">' + PF.icon('grid') + 'Мои проекты<span class="count">' + n + '</span></a>' +
    '<a href="templates.html">' + PF.icon('star') + 'Шаблоны</a>' +
    '<a class="on" href="export.html">' + PF.icon('download') + 'Экспорты</a>' +
    '<a href="editor.html">' + PF.icon('brush') + 'Редактор</a>' +
    '<a href="settings.html">' + PF.icon('settings') + 'Настройки</a>' +
    '<a href="admin.html">' + PF.icon('users') + 'Администрирование</a>';

  var P = [
    { n: 'Оригинал', k: 'ori', w: 0, h: 0 },
    { n: 'Instagram пост', k: 'ig', w: 1080, h: 1080 },
    { n: 'Сторис', k: 'st', w: 1080, h: 1920 },
    { n: 'VK', k: 'vk', w: 1200, h: 800 },
    { n: 'Печать A4', k: 'a4', w: 2480, h: 3508 }
  ];
  var cur = localStorage.getItem('pf-exp-preset') || 'ori';

  $('presets').innerHTML = P.map(function (p) {
    return '<div class="pr' + (p.k === cur ? ' on' : '') + '" data-k="' + p.k + '"><b>' + p.n +
      '</b><small>' + (p.w ? p.w + ' × ' + p.h + ' px' : 'размер проекта') + '</small></div>';
  }).join('');
  $('presets').addEventListener('click', function (e) {
    var el = e.target.closest('[data-k]'); if (!el) return;
    cur = el.dataset.k; localStorage.setItem('pf-exp-preset', cur);
    Array.prototype.forEach.call(this.children, function (c) { c.classList.remove('on'); });
    el.classList.add('on');
    PF.toast('Пресет «' + P.filter(function (p) { return p.k === cur; })[0].n + '» выбран', 'info');
  });
  $('fmt').onchange = function () { localStorage.setItem('pf-exp-fmt', this.value); };
  $('fmt').value = localStorage.getItem('pf-exp-fmt') || 'image/png';

  function render() {
    var l = PF.Projects.all();
    if (!l.length) {
      $('list').innerHTML = '<div class="empty"><div class="ic">📁</div><h3>Пока нет проектов</h3>' +
        '<p class="mut">Создайте проект, чтобы его экспортировать</p>' +
        '<a class="btn primary" href="dashboard.html">К проектам</a></div>';
      return;
    }
    $('list').innerHTML = l.map(function (p) {
      return '<div class="item"><div class="thumb ' + p.grad + '"></div>' +
        '<div class="m"><b>' + p.name + '</b><small>' + p.w + '×' + p.h + ' px · ' + PF.when(p.updated) + '</small></div>' +
        '<a class="btn" href="editor.html?p=' + p.id + '">Открыть</a>' +
        '<a class="btn primary" href="editor.html?p=' + p.id + '&export=1">Экспортировать</a></div>';
    }).join('');
  }
  render();
})();
</script>
</body>
</html>
