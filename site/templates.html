<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаблоны — PixelForge</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .tcard{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r-lg);overflow:hidden;
    transition:transform var(--dur),border-color var(--dur),box-shadow var(--dur)}
  .tcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
  .tcard .prev{height:170px;display:flex;align-items:center;justify-content:center;position:relative}
  .tcard .prev span{font-size:24px;font-weight:800;color:#fff;letter-spacing:1.5px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .tcard .meta{padding:12px 14px 14px}
  .tcard .meta b{display:block;font-size:14px;margin-bottom:2px}
  .tcard .meta small{color:var(--t3);font-size:11.5px}
  .tcard .acts{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="top"></header>
  <div class="body">
    <nav class="side" id="side"></nav>
    <main class="main">
      <div class="pagehead">
        <h2>Библиотека шаблонов</h2><span class="dim mono" id="cnt"></span>
        <span class="spacer"></span>
        <input class="input" id="q" placeholder="Найти шаблон…" style="width:260px">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap" id="cats"></div>
      <div class="grid g4" id="list"></div>
    </main>
  </div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  if (!PF.User.require('templates.html')) return;
  PF.header($('top'), { left: '<a class="btn ghost" href="index.html">Карта сайта</a>' });

  var n = PF.Projects.all().length;
  $('side').innerHTML =
    '<a href="dashboard.html">' + PF.icon('grid') + 'Мои проекты<span class="count">' + n + '</span></a>' +
    '<a class="on" href="templates.html">' + PF.icon('star') + 'Шаблоны</a>' +
    '<a href="export.html">' + PF.icon('download') + 'Экспорты</a>' +
    '<a href="editor.html">' + PF.icon('brush') + 'Редактор</a>' +
    '<a href="settings.html">' + PF.icon('settings') + 'Настройки</a>' +
    '<a href="admin.html">' + PF.icon('users') + 'Администрирование</a>';

  var CATS = ['Все', 'Соцсети', 'Сторис', 'Презентации', 'Бизнес', 'Обложки', 'Печать'];
  var T = [
    ['Летняя распродажа', 'Соцсети', 1080, 1080, 'g1', 'SALE'],
    ['Минимал сторис', 'Сторис', 1080, 1920, 'g4', 'MINIMAL'],
    ['Бизнес-карточка', 'Бизнес', 1200, 800, 'g3', 'BUSINESS'],
    ['Неон-постер', 'Соцсети', 1080, 1350, 'g6', 'NEON'],
    ['Ретро-открытка', 'Обложки', 1400, 1000, 'g2', 'RETRO'],
    ['Подкаст-обложка', 'Обложки', 1400, 1400, 'g5', 'PODCAST'],
    ['Промо выставки', 'Печать', 2480, 3508, 'g1', 'EXPO'],
    ['Y2K-коллаж', 'Соцсети', 1080, 1080, 'g6', 'Y2K'],
    ['Меню кофейни', 'Печать', 1240, 1754, 'g2', 'MENU'],
    ['Слайд-презентация', 'Презентации', 1920, 1080, 'g3', 'SLIDE'],
    ['Афиша концерта', 'Печать', 2480, 3508, 'g1', 'CONCERT'],
    ['Обложка канала', 'Обложки', 2560, 1440, 'g5', 'CHANNEL']
  ];
  var cat = 'Все', query = '';

  $('cats').innerHTML = CATS.map(function (c, i) {
    return '<span class="chip' + (i === 0 ? ' on' : '') + '" data-c="' + c + '">' + c + '</span>';
  }).join('');
  $('cats').addEventListener('click', function (e) {
    var el = e.target.closest('[data-c]'); if (!el) return;
    cat = el.dataset.c;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.remove('on'); });
    el.classList.add('on'); render();
  });
  $('q').addEventListener('input', function () { query = this.value.toLowerCase(); render(); });

  function render() {
    var l = T.filter(function (t) {
      return (cat === 'Все' || t[1] === cat) && (!query || t[0].toLowerCase().indexOf(query) >= 0);
    });
    $('cnt').textContent = l.length + ' из ' + T.length;
    if (!l.length) { $('list').innerHTML = ''; $('list').insertAdjacentHTML('afterend',
      '<div class="empty"><div class="ic">🔍</div><h3>Ничего не найдено</h3><p class="mut">Сбросьте фильтры</p></div>'); return; }
    $('list').innerHTML = l.map(function (t) {
      return '<div class="tcard" data-t="' + t[0] + '"><div class="prev ' + t[4] + '"><span>' + t[5] + '</span>' +
        '<span class="badge" style="position:absolute;top:10px;left:10px">Бесплатно</span></div>' +
        '<div class="meta"><b>' + t[0] + '</b><small>' + t[1] + ' · ' + t[2] + '×' + t[3] + '</small>' +
        '<div class="acts"><button class="btn sm primary" data-use="1">Использовать</button>' +
        '<button class="btn sm" data-view="1">Просмотр</button></div></div></div>';
    }).join('');
  }

  $('list').addEventListener('click', function (e) {
    var c = e.target.closest('[data-t]'); if (!c) return;
    var name = c.dataset.t;
    var t = T.filter(function (x) { return x[0] === name; })[0];
    if (e.target.closest('[data-use]')) {
      var p = PF.Projects.create({ name: name, w: t[2], h: t[3], grad: t[4], template: null });
      PF.toast('Проект создан из шаблона «' + name + '»', '', 'Готово');
      setTimeout(function () { location.href = 'editor.html?p=' + p.id; }, 400);
    } else if (e.target.closest('[data-view]')) {
      PF.toast(name + ' · ' + t[1] + ' · ' + t[2] + '×' + t[3] + ' px', 'info', 'Просмотр шаблона');
    }
  });
  render();
})();
</script>
</body>
</html>
