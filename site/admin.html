<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Администрирование — PixelForge</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;
    place-items:center;font-size:10.5px;font-weight:700;flex:0 0 auto}
  .u{display:flex;align-items:center;gap:10px}
  .bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;width:90px;display:inline-block;
    vertical-align:middle;margin-right:8px}
  .bar i{display:block;height:100%;background:var(--grad-cool)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="top"></header>
  <div class="body">
    <nav class="side" id="side"></nav>
    <main class="main">
      <div class="pagehead"><h2>Администрирование</h2>
        <span class="badge warn">роль L3</span>
        <span class="spacer"></span>
        <input class="input" id="q" placeholder="Поиск по имени или e-mail…" style="width:280px">
        <select class="input" id="role" style="width:170px">
          <option value="">Все роли</option><option>Новичок</option>
          <option>Продвинутый</option><option>Администратор</option>
        </select>
      </div>

      <div class="stats">
        <div class="stat"><b id="m1">—</b><small>пользователей</small></div>
        <div class="stat"><b id="m2">—</b><small>проектов создано</small></div>
        <div class="stat"><b id="m3">—</b><small>активных сегодня</small></div>
        <div class="stat"><b id="m4">6,8 %</b><small>конверсия L1 → L2</small></div>
      </div>

      <div class="card" style="overflow:hidden">
        <table class="tbl">
          <thead><tr>
            <th>Пользователь</th><th>E-mail</th><th>Роль</th><th>Уровень</th>
            <th>Хранилище</th><th>Последний вход</th><th>Статус</th><th></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="hint" id="cnt"></p>
    </main>
  </div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  if (!PF.User.require('admin.html')) return;
  PF.header($('top'), { left: '<a class="btn ghost" href="index.html">Карта сайта</a>' });
  var n = PF.Projects.all().length;
  $('side').innerHTML =
    '<a href="dashboard.html">' + PF.icon('grid') + 'Мои проекты<span class="count">' + n + '</span></a>' +
    '<a href="templates.html">' + PF.icon('star') + 'Шаблоны</a>' +
    '<a href="export.html">' + PF.icon('download') + 'Экспорты</a>' +
    '<a href="editor.html">' + PF.icon('brush') + 'Редактор</a>' +
    '<a href="settings.html">' + PF.icon('settings') + 'Настройки</a>' +
    '<a class="on" href="admin.html">' + PF.icon('users') + 'Администрирование</a>';

  var U = [
    ['Ирина Соколова', 'irina@studio.ru', 'Продвинутый', 'L2', 78, 'сегодня 14:32', 'active'],
    ['Артём Петров', 'artem@smm.ru', 'Новичок', 'L1', 62, 'сегодня 11:04', 'active'],
    ['Мария Ким', 'maria@edu.ru', 'Новичок', 'L1', 41, 'вчера 20:11', 'active'],
    ['Олег Сидоров', 'oleg@mail.ru', 'Администратор', 'L3', 95, 'сегодня 09:15', 'active'],
    ['Юлия Орлова', 'julia@design.io', 'Продвинутый', 'L2', 88, '3 дня назад', 'blocked'],
    ['Дмитрий Волков', 'dmitry@photo.ru', 'Новичок', 'L1', 96, '5 дней назад', 'idle'],
    ['Анна Белова', 'anna@agency.ru', 'Продвинутый', 'L2', 55, 'сегодня 08:02', 'active'],
    ['Павел Гусев', 'pavel@print.ru', 'Новичок', 'L1', 30, '2 дня назад', 'idle']
  ];
  var q = '', roleF = '';

  $('m1').textContent = U.length;
  $('m2').textContent = '48 320';
  $('m3').textContent = U.filter(function (u) { return u[6] === 'active'; }).length;

  function initials(nm) { return nm.split(' ').map(function (p) { return p[0]; }).join('').slice(0, 2); }

  function render() {
    var l = U.filter(function (u) {
      var okQ = !q || (u[0] + ' ' + u[1]).toLowerCase().indexOf(q) >= 0;
      return okQ && (!roleF || u[2] === roleF);
    });
    $('cnt').textContent = 'Показано ' + l.length + ' из ' + U.length + ' пользователей';
    $('rows').innerHTML = l.map(function (u, i) {
      var st = u[6] === 'active' ? ['Активен', 'var(--success)'] :
               u[6] === 'blocked' ? ['Заблокирован', 'var(--err)'] : ['Нет входа', 'var(--warn)'];
      return '<tr data-i="' + U.indexOf(u) + '">' +
        '<td><div class="u"><span class="avatar">' + initials(u[0]) + '</span>' + u[0] + '</div></td>' +
        '<td class="dim">' + u[1] + '</td>' +
        '<td><select class="input" data-role="' + U.indexOf(u) + '" style="height:30px;font-size:12px">' +
          ['Новичок', 'Продвинутый', 'Администратор'].map(function (r) {
            return '<option' + (r === u[2] ? ' selected' : '') + '>' + r + '</option>';
          }).join('') + '</select></td>' +
        '<td class="mono">' + u[3] + '</td>' +
        '<td><span class="bar"><i style="width:' + u[4] + '%"></i></span><span class="mono dim">' + u[4] + ' %</span></td>' +
        '<td class="dim">' + u[5] + '</td>' +
        '<td><span class="dot" style="background:' + st[1] + '"></span>' + st[0] + '</td>' +
        '<td><button class="btn sm" data-block="' + U.indexOf(u) + '">' +
          (u[6] === 'blocked' ? 'Разблокировать' : 'Заблокировать') + '</button></td></tr>';
    }).join('');
  }

  $('q').addEventListener('input', function () { q = this.value.toLowerCase(); render(); });
  $('role').onchange = function () { roleF = this.value; render(); };

  document.addEventListener('change', function (e) {
    var r = e.target.closest('[data-role]'); if (!r) return;
    var u = U[+r.dataset.role];
    u[2] = r.value;
    u[3] = r.value === 'Администратор' ? 'L3' : r.value === 'Продвинутый' ? 'L2' : 'L1';
    PF.toast('Роль пользователя ' + u[0] + ' изменена на «' + u[2] + '»', '', 'Сохранено');
    render();
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-block]'); if (!b) return;
    var u = U[+b.dataset.block];
    u[6] = u[6] === 'blocked' ? 'active' : 'blocked';
    PF.toast('Пользователь ' + u[0] + (u[6] === 'blocked' ? ' заблокирован' : ' разблокирован'),
      u[6] === 'blocked' ? 'warn' : '', 'Готово');
    render();
  });
  render();
})();
</script>
</body>
</html>
