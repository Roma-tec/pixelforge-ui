<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PixelForge — мобильная версия</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  body{overflow:auto;background:var(--bg0);display:flex;justify-content:center;padding:24px 12px}
  .phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 48px);background:var(--bg1);
    border:10px solid #05050a;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
  .ph-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .ph-body{flex:1 1 auto;overflow:auto;padding:0 16px 16px}
  .ph-tabs{flex:0 0 auto;height:60px;border-top:1px solid var(--brd);display:flex;align-items:center;
    justify-content:space-around;background:var(--bg2);position:relative}
  .ph-tabs a{color:var(--t3);display:grid;place-items:center;gap:3px;font-size:9.5px;text-decoration:none}
  .ph-tabs a.on{color:var(--accent)}
  .fab{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;
    background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(108,76,241,.5);
    border:3px solid var(--bg2)}
  .mcard{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--brd);
    border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer;transition:all var(--dur)}
  .mcard:hover{border-color:var(--accent)}
  .mcard .th{width:76px;height:76px;border-radius:10px;flex:0 0 auto}
  .mcard b{display:block;font-size:14px;margin-bottom:3px}
  .mcard small{color:var(--t3);font-size:11.5px;display:block}
  .ph-canvas{flex:1 1 auto;display:grid;place-items:center;background:var(--canvas);overflow:hidden;padding:12px}
  .ph-canvas canvas{max-width:100%;max-height:100%;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#fff}
  .ph-dock{flex:0 0 auto;height:62px;background:var(--bg2);border-top:1px solid var(--brd);
    display:flex;align-items:center;gap:6px;overflow-x:auto;padding:0 10px}
  .ph-dock button{flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:1px solid var(--brd);
    background:var(--bg3);color:var(--t2);display:grid;place-items:center;cursor:pointer;font-size:10px}
  .ph-dock button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .presets{display:flex;gap:8px;overflow-x:auto;padding:8px 0;flex:0 0 auto}
  .presets button{flex:0 0 auto;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--brd);
    background:var(--bg3);color:var(--t2);font-size:12px;cursor:pointer}
  .presets button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="phone">
  <div class="ph-head">
    <b style="font-size:18px" id="ttl">Мои проекты</b>
    <span class="spacer"></span>
    <button class="btn ghost icon" data-theme-toggle style="width:32px;height:32px">☀</button>
    <span style="width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;
      display:grid;place-items:center;font-size:10px;font-weight:700" id="av">Г</span>
  </div>
  <div class="ph-body" id="body"></div>
  <nav class="ph-tabs" id="tabs"></nav>
</div>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var view = 'list', cur = null, filter = 'none', tool = 'move';

  var FILTERS = [
    ['none', 'Оригинал', 'none'], ['warm', 'Закат', 'sepia(.45) saturate(1.5) hue-rotate(-12deg)'],
    ['cold', 'Утро', 'hue-rotate(18deg) saturate(.8) brightness(1.08)'],
    ['film', 'Плёнка', 'sepia(.3) contrast(1.3) saturate(.85)'],
    ['bw', 'Ч/Б', 'grayscale(1) contrast(1.12)'], ['neon', 'Неон', 'saturate(2.1) contrast(1.25)'],
    ['blur', 'Блюр', 'blur(5px)'], ['vintage', 'Винтаж', 'sepia(.6) saturate(.7) contrast(1.15)']
  ];

  $('av').textContent = PF.User.initials();

  function tabs() {
    $('tabs').innerHTML =
      '<a href="#" data-v="list" class="' + (view === 'list' ? 'on' : '') + '">' + PF.icon('grid', 20) + 'Проекты</a>' +
      '<a href="#" data-v="create"><span class="fab">' + PF.icon('plus', 22) + '</span></a>' +
      '<a href="#" data-v="templates" class="' + (view === 'templates' ? 'on' : '') + '">' + PF.icon('star', 20) + 'Шаблоны</a>' +
      '<a href="#" data-v="settings" class="' + (view === 'settings' ? 'on' : '') + '">' + PF.icon('settings', 20) + 'Ещё</a>';
    $('tabs').onclick = function (e) {
      var a = e.target.closest('[data-v]'); if (!a) return;
      e.preventDefault();
      var v = a.dataset.v;
      if (v === 'create') { var p = PF.Projects.create({ name: 'Мобильный проект', w: 1080, h: 1080 }); openEditor(p.id); return; }
      view = v; tabs(); render();
    };
  }

  function render() {
    if (view === 'list') {
      var l = PF.Projects.all();
      $('ttl').textContent = 'Мои проекты';
      $('body').innerHTML = l.length ? l.map(function (p) {
        return '<div class="mcard" data-p="' + p.id + '"><div class="th ' + p.grad + '"></div>' +
          '<div><b>' + p.name + '</b><small>' + p.w + '×' + p.h + ' px</small>' +
          '<small>' + PF.when(p.updated) + '</small></div></div>';
      }).join('') : '<div class="empty"><div class="ic">📁</div><h3>Нет проектов</h3>' +
        '<p class="mut">Нажмите «+», чтобы создать</p></div>';
    } else if (view === 'templates') {
      $('ttl').textContent = 'Шаблоны';
      var T = [['Сторис', 1080, 1920, 'g2'], ['Пост', 1080, 1080, 'g1'],
               ['Обложка', 1200, 800, 'g3'], ['Аватар', 512, 512, 'g6']];
      $('body').innerHTML = T.map(function (t) {
        return '<div class="mcard" data-t="' + t[0] + '" data-w="' + t[1] + '" data-h="' + t[2] + '" data-g="' + t[3] + '">' +
          '<div class="th ' + t[3] + '"></div><div><b>' + t[0] + '</b>' +
          '<small>' + t[1] + '×' + t[2] + ' px</small><small>Бесплатно</small></div></div>';
      }).join('');
    } else {
      $('ttl').textContent = 'Ещё';
      $('body').innerHTML =
        '<a class="btn wide" href="dashboard.html" style="margin-bottom:10px">Открыть полную версию</a>' +
        '<a class="btn wide" href="settings.html" style="margin-bottom:10px">Настройки</a>' +
        '<a class="btn wide" href="index.html" style="margin-bottom:10px">Карта сайта</a>' +
        '<button class="btn wide danger" id="out">Выйти</button>';
      $('out').onclick = function () { PF.User.out(); location.href = 'login.html'; };
    }
  }

  $('body').addEventListener('click', function (e) {
    var c = e.target.closest('[data-p]');
    if (c) { openEditor(c.dataset.p); return; }
    var t = e.target.closest('[data-t]');
    if (t) {
      var p = PF.Projects.create({ name: t.dataset.t, w: +t.dataset.w, h: +t.dataset.h, grad: t.dataset.g });
      PF.toast('Проект создан', '', 'Готово');
      openEditor(p.id);
    }
  });

  function openEditor(id) {
    var p = PF.Projects.get(id); if (!p) return;
    cur = p; view = 'editor'; filter = 'none'; tool = 'move';
    $('ttl').textContent = p.name;
    tabs();
    var W = p.w, H = p.h;
    $('body').innerHTML =
      '<div class="presets" id="pr"></div>' +
      '<div class="ph-canvas" style="height:340px;border-radius:12px"><canvas id="mcv"></canvas></div>' +
      '<div class="ph-canvas" style="height:340px;border-radius:12px;display:none"></div>';
    $('pr').innerHTML = FILTERS.map(function (f) {
      return '<button data-f="' + f[0] + '"' + (f[0] === 'none' ? ' class="on"' : '') + '>' + f[1] + '</button>';
    }).join('');
    var cv = $('mcv');
    var maxW = 340, k = Math.min(maxW / W, 320 / H, 1);
    cv.width = W; cv.height = H;
    cv.style.width = Math.round(W * k) + 'px'; cv.style.height = Math.round(H * k) + 'px';
    var ctx = cv.getContext('2d');

    function paint() {
      var g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#1B1B4A'); g.addColorStop(.6, '#5A2E96'); g.addColorStop(1, '#F14CA6');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.filter = filter === 'none' ? 'none' : FILTERS.filter(function (f) { return f[0] === filter; })[0][2];
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      var c = W / 1080;
      ctx.beginPath(); ctx.arc(790 * c, 250 * c, 95 * c, 0, 6.2832); ctx.fillStyle = '#F5A623'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 620 * c); ctx.lineTo(280 * c, 330 * c); ctx.lineTo(620 * c, 620 * c);
      ctx.closePath(); ctx.fillStyle = 'rgba(14,14,19,.5)'; ctx.fill();
      ctx.font = '800 ' + (88 * c) + 'px Inter, Arial'; ctx.fillStyle = '#fff';
      ctx.fillText('SUMMER', 70 * c, 250 * c);
      ctx.fillText('SALE 25', 70 * c, 350 * c);
      ctx.filter = 'none';
    }

    $('pr').onclick = function (e) {
      var b = e.target.closest('[data-f]'); if (!b) return;
      filter = b.dataset.f;
      Array.prototype.forEach.call(this.children, function (x) { x.classList.remove('on'); });
      b.classList.add('on'); paint();
    };

    $('body').insertAdjacentHTML('beforeend',
      '<div class="ph-dock" id="dock" style="border-radius:12px;margin-top:12px;height:58px">' +
      [['move', 'move', 'Перемещ.'], ['brush', 'brush', 'Кисть'], ['text', 'text', 'Текст'],
       ['crop', 'crop', 'Обрезка'], ['export', 'download', 'Экспорт'], ['back', 'back', 'Назад']]
        .map(function (t) { return '<button data-t="' + t[0] + '"' + (t[0] === 'move' ? ' class="on"' : '') +
          '>' + PF.icon(t[1], 18) + '<span>' + t[2] + '</span></button>'; }).join('') + '</div>');

    $('dock').onclick = function (e) {
      var b = e.target.closest('[data-t]'); if (!b) return;
      var t = b.dataset.t;
      if (t === 'back') { view = 'list'; tabs(); render(); return; }
      if (t === 'export') {
        var a = document.createElement('a');
        a.href = cv.toDataURL('image/png');
        a.download = p.name.replace(/\s+/g, '_').toLowerCase() + '_mobile.png';
        a.click();
        PF.toast('PNG сохранён', '', 'Экспортировано');
        return;
      }
      Array.prototype.forEach.call(this.children, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      PF.toast('Инструмент: ' + b.textContent.trim(), 'info');
    };
    paint();
  }

  tabs(); render();
})();
</script>
</body>
</html>
