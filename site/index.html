<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelForge — карта сайта</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  body{overflow:auto}
  .page{max-width:1180px;margin:0 auto;padding:48px 28px 90px}
  .hero{display:flex;align-items:center;gap:18px;margin-bottom:8px}
  .hero .logo{width:52px;height:52px}
  h1{font-size:36px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:16px}
  .lnk{display:block;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r-lg);
    padding:18px;text-decoration:none;color:inherit;transition:all var(--dur)}
  .lnk:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow);text-decoration:none}
  .lnk b{display:block;font-size:15px;margin-bottom:4px}
  .lnk small{color:var(--t3);font-size:12px}
  .lnk .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;margin-bottom:12px}
  .flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--t2)}
  .flow code{background:var(--bg3);border:1px solid var(--brd);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<header class="topbar" id="top"></header>
<div class="page">
  <div class="hero">
    <span class="logo"></span>
    <div>
      <h1>PixelForge</h1>
      <p class="mut" style="margin:4px 0 0">Работающий прототип графического редактора · S2G11, вариант № 3</p>
    </div>
    <span class="spacer"></span>
    <button class="btn ghost icon" data-theme-toggle title="Тема">☀</button>
  </div>

  <div class="flow">
    Поток приложения: <code>login.html</code> → <code>dashboard.html</code> → <code>editor.html</code> → экспорт
  </div>

  <h2 style="font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin:40px 0 0">Работающее приложение</h2>
  <div class="grid2" id="app"></div>

  <h2 style="font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin:40px 0 0">Макеты и дизайн-система</h2>
  <div class="grid2" id="design"></div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  PF.header($('top'));

  var APP = [
    ['login.html', 'S1 · Вход и регистрация', 'Реальная форма: валидация, вкладки, восстановление пароля', 'user'],
    ['dashboard.html', 'S0 · Мои проекты', 'Список проектов, поиск, сортировка, создание и удаление', 'grid'],
    ['editor.html', 'S2 · Редактор', 'Холст, инструменты, слои, фильтры, история, рисование', 'brush'],
    ['templates.html', 'S10 · Шаблоны', 'Библиотека шаблонов — проект создаётся в один клик', 'star'],
    ['export.html', 'S6 · Экспорт', 'Пресеты платформ и скачивание PNG / JPG / WEBP', 'download'],
    ['settings.html', 'S3 · Настройки', 'Тема, акцент, масштаб, профиль, хранилище', 'settings'],
    ['admin.html', 'S11 · Администрирование', 'Таблица пользователей, поиск, роли, блокировки', 'users'],
    ['mobile.html', 'S9 · Мобильная версия', 'Упрощённый интерфейс для телефона', 'phone']
  ];
  var DS = [
    ['screens.html', 'Все макеты проекта', '32 векторных экрана: светлая и тёмная темы', 'image'],
    ['ui-kit.html', 'UI-кит', 'Компоненты и состояния интерфейса', 'shape'],
    ['moodboard.html', 'Moodboard', 'Цвета, шрифты, иконки, материалы', 'sparkle'],
    ['flow-map.html', 'User Flow Map (A4)', 'Вся система на одном листе', 'move'],
    ['use-case.html', 'UML Use-Case', '19 прецедентов, 5 акторов', 'share'],
    ['pdf/PixelForge_Makety.pdf', 'PDF: макеты (30 стр.)', 'Векторный отчёт со всеми экранами', 'save'],
    ['pdf/PixelForge_Diagrammy.pdf', 'PDF: диаграммы', 'User Flow Map и UML Use-Case', 'save']
  ];
  function card(a) {
    return '<a class="lnk" href="' + a[0] + '"><div class="ico">' + PF.icon(a[3] || 'grid', 18) +
      '</div><b>' + a[1] + '</b><small>' + a[2] + '</small></a>';
  }
  $('app').innerHTML = APP.map(card).join('');
  $('design').innerHTML = DS.map(card).join('');
})();
</script>
</body>
</html>
